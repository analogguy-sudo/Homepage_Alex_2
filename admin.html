<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#0e0e0e;color:#ededeb;font:16px/1.5 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:1.5rem}h1{font-weight:600;font-size:1.3rem}a{color:#a8a8a5}
input,button{font:inherit;background:#1b1b1b;color:inherit;border:1px solid #444;border-radius:4px;padding:.45rem .6rem;min-width:0}
button{cursor:pointer;background:#ededeb;color:#0e0e0e;border:0;font-weight:600}button.s{background:#1b1b1b;color:#ededeb;border:1px solid #444}
.box{background:#151515;border:1px solid #2a2a2a;border-radius:6px;padding:1rem;margin:1rem 0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem;margin:.5rem 0}
.item{display:grid;grid-template-columns:90px 1fr;gap:1rem;align-items:start}.item img{width:90px;height:90px;object-fit:cover;border-radius:3px}
.msg{min-height:1.5rem;color:#c9c9c5}.hide{display:none}
</style></head><body><main>
<h1>Admin: Kontaktbogen</h1><p class="msg" id="msg" role="status"></p>
<form id="login" class="box"><div class="row"><input id="em" type="email" placeholder="E-Mail" autocomplete="username" required><input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" required><button>Anmelden</button></div></form>
<div id="app" class="hide">
<p><button class="s" id="out" type="button">Abmelden</button> &nbsp; <a href="index.html">zur Seite</a></p>
<form id="up" class="box"><b>Neues Foto</b>
<div class="row"><input id="f" type="file" accept="image/*" required></div>
<div class="row"><input name="title" placeholder="Titel" required><input name="film" placeholder="Film"><input name="camera" placeholder="Kamera"><input name="format" placeholder="Format (35 mm)"><input name="year" type="number" placeholder="Jahr"><input name="location" placeholder="Ort"><input name="cat" placeholder="Kategorien, mit Komma"><input name="sort" type="number" placeholder="Reihenfolge (leer = ans Ende)"></div>
<button>Hochladen</button></form>
<div id="list"></div></div>
<script>
const U="https://owbbsnujnkhyyqvagtai.supabase.co",KEY="sb_publishable_29TK9hJ-e8e4eW9rp_eA8A__EHL2Kga";
const $=i=>document.getElementById(i),F=["title","film","camera","format","year","location","cat","sort"];
const enc=p=>p.split("/").map(encodeURIComponent).join("/"),say=t=>$("msg").textContent=t||"";
let tok=null,rows=[];try{tok=sessionStorage.getItem("tok")}catch(e){}
function show(on){$("login").classList.toggle("hide",on);$("app").classList.toggle("hide",!on)}
function out(){tok=null;try{sessionStorage.removeItem("tok")}catch(e){}show(false)}
async function api(p,o={}){
  const h={apikey:KEY,...(tok?{Authorization:"Bearer "+tok}:{}),...(o.headers||{})};
  const r=await fetch(U+p,{...o,headers:h});
  if(r.status===401){out();throw new Error("Bitte neu anmelden.")}
  if(!r.ok)throw new Error((await r.text()).slice(0,200));return r}
function body(get){const o={};F.forEach(k=>{const v=get(k);o[k]=(k==="year"||k==="sort")?(v===""?null:Number(v)):(v||null)});o.position=o.sort;return o}
const J={"Content-Type":"application/json",Prefer:"return=minimal"};
$("out").onclick=out;
$("login").onsubmit=async e=>{e.preventDefault();say("Anmelden …");
  try{const r=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value,password:$("pw").value})});
  const d=await r.json();if(!d.access_token)throw new Error(d.msg||d.error_description||"Login fehlgeschlagen");
  tok=d.access_token;try{sessionStorage.setItem("tok",tok)}catch(x){}say("");load()}catch(x){say(x.message)}};
async function load(){try{rows=await(await api("/rest/v1/photos?select=*&storage_path=not.is.null&order=sort.asc")).json();draw();show(true)}catch(x){say(x.message)}}
function draw(){const L=$("list");L.innerHTML="";rows.forEach(r=>{const d=document.createElement("div");d.className="box item";
  d.innerHTML='<img alt=""><div><div class="row">'+F.map(k=>'<input data-k="'+k+'" type="'+(k==="year"||k==="sort"?"number":"text")+'" placeholder="'+k+'">').join("")+'</div><button type="button" class="sv">Speichern</button> <button type="button" class="s dl">Löschen</button></div>';
  d.querySelector("img").src=U+"/storage/v1/object/public/photos/"+enc(r.storage_path);
  d.querySelectorAll("input").forEach(i=>i.value=r[i.dataset.k]??"");
  d.querySelector(".sv").onclick=async()=>{try{const o=body(k=>d.querySelector('[data-k="'+k+'"]').value.trim());if(o.sort===null)o.sort=o.position=0;
    await api("/rest/v1/photos?id=eq."+r.id,{method:"PATCH",headers:J,body:JSON.stringify(o)});say("Gespeichert.")}catch(x){say(x.message)}};
  d.querySelector(".dl").onclick=async()=>{if(!confirm("Foto löschen?"))return;try{
    await api("/rest/v1/photos?id=eq."+r.id,{method:"DELETE"});await api("/storage/v1/object/photos/"+enc(r.storage_path),{method:"DELETE"}).catch(()=>{});say("Gelöscht.");load()}catch(x){say(x.message)}};
  L.appendChild(d)})}
$("up").onsubmit=async e=>{e.preventDefault();say("Lade hoch …");
  try{const file=$("f").files[0],bmp=await createImageBitmap(file),sc=Math.min(1,2000/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
  c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.88));
  const slug=file.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\.[^.]+$/,"").replace(/[^\w-]+/g,"_");
  const name=Date.now()+"_"+slug+".jpg";
  await api("/storage/v1/object/photos/"+name,{method:"POST",headers:{"Content-Type":"image/jpeg"},body:blob});
  const o=body(k=>e.target.elements[k].value.trim());if(o.sort===null)o.sort=o.position=Math.max(0,...rows.map(r=>r.sort||0))+1;
  o.title=o.title||"Ohne Titel";o.storage_path=name;o.image_path=name;
  await api("/rest/v1/photos",{method:"POST",headers:J,body:JSON.stringify(o)});
  e.target.reset();say("Hochgeladen.");load()}catch(x){say(x.message)}};
if(tok)load();
</script></main></body></html>
